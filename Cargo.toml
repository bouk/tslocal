[package]
name = "tslocalapi"
version = "0.0.8"
edition = "2024"
description = "Client library for the Tailscale Local API"
license = "BSD-3-Clause"
repository = "https://github.com/bouk/tslocalapi"
homepage = "https://github.com/bouk/tslocalapi"
readme = "README.md"
keywords = ["tailscale", "local-api", "vpn"]
categories = ["api-bindings", "network-programming"]

[lib]
path = "rust/src/lib.rs"

[[example]]
name = "status"
path = "rust/examples/status.rs"

[[example]]
name = "whois"
path = "rust/examples/whois.rs"

[[example]]
name = "serve_config"
path = "rust/examples/serve_config.rs"

[dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

tower-service = "0.3"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
